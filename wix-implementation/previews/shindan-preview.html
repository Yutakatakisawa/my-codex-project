<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>診断ページプレビュー | 職人WEBタキサワ</title>
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="tag">/shindan プレビュー</div>
        <h1>3分でわかる 職人WEB集客診断</h1>
        <p>20問に答えるだけで、あなたの弱点と今週やるべき改善アクションが分かります。</p>
      </section>

      <section class="panel">
        <h2>基本情報</h2>
        <div class="basic-grid">
          <input class="input" id="nameInput" value="瀧澤 太郎" />
          <select class="select" id="industryDropdown">
            <option>屋根屋</option>
            <option>塗装屋</option>
            <option>外構業者</option>
            <option>一人親方</option>
          </select>
          <input class="input" id="areaInput" value="岩手県盛岡市" />
        </div>
      </section>

      <section class="panel">
        <h2>20問診断（4択）</h2>
        <div id="questionList"></div>
      </section>

      <section class="panel footer-box">
        <div class="error" id="errorText">※未回答の設問があります（3問）</div>
        <button class="button" id="submitBtn">診断結果を見る</button>
      </section>
    </main>

    <script>
      const questionTitles = [
        "自社名で検索したとき、ホームページは表示されますか？",
        "「地域名＋業種」で検索したときは？",
        "Googleビジネスプロフィールの運用状況は？",
        "施工事例やブログ更新頻度は？",
        "サイトに掲載している施工事例数は？",
        "施工事例の質（写真・説明）は？",
        "お客様の声（口コミ）掲載は？",
        "代表者プロフィールの充実度は？",
        "問い合わせ手段は何を置いていますか？",
        "スマホで電話しやすい設計ですか？",
        "問い合わせフォームの入力負担は？",
        "問い合わせ後の返信速度は？",
        "LINE公式アカウントの活用状況は？",
        "見積提出後のフォローは？",
        "過去顧客への再アプローチは？",
        "問い合わせ情報の管理方法は？",
        "月次で数字を確認していますか？",
        "SNS発信の継続状況は？",
        "施工写真・動画の整理は？",
        "Web運用の担当は決まっていますか？"
      ];

      const optionLabels = [
        { key: "A", text: "A: 良い状態（3点）" },
        { key: "B", text: "B: まずまず（2点）" },
        { key: "C", text: "C: 弱い（1点）" },
        { key: "D", text: "D: 未整備（0点）" }
      ];

      const questionList = document.getElementById("questionList");
      questionTitles.forEach((title, index) => {
        const qNumber = index + 1;
        const card = document.createElement("article");
        card.className = "question";
        card.id = `q${qNumber}`;
        card.innerHTML = `
          <p class="q-title"><strong>Q${qNumber}.</strong> ${title}</p>
          <div class="option-row">
            ${optionLabels
              .map(
                (option) => `
              <div class="option">
                <span class="dot"></span>
                <span>${option.text}</span>
              </div>
            `
              )
              .join("")}
          </div>
        `;
        questionList.appendChild(card);
      });
    </script>
  </body>
</html>
